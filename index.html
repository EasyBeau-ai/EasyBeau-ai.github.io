<!DOCTYPE html>
<html>
<head>
  <title>EasyBeau</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <style>
    body{
      font-family: -apple-system,BlinkMacSystemFont,Segoe UI,Roboto;
      margin:0;
      color:#111;
      text-align:center;
      overflow-x:hidden;
      background:#fafafa;
    }

    /* dynamic wave background */
    canvas#waveBG{
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      z-index:-1;
    }

    .container{
      max-width:800px;
      margin:120px auto;
      padding:20px;
    }

    h1{
      font-size:48px;
      margin-bottom:20px;
    }

    .tagline{
      font-size:24px;
      color:#555;
    }

    .description{
      margin-top:40px;
      font-size:18px;
      line-height:1.6;
      color:#444;
    }

    .footer{
      font-size:15px;
      color:#6e7681;
      margin-top:60px;
    }

    /* contact button */
    .contact-button{
      position:fixed;
      top:25px;
      right:30px;
      padding:10px 18px;
      border:1px solid #ddd;
      background:white;
      border-radius:20px;
      font-size:14px;
      cursor:pointer;
      transition:all 0.2s;
      z-index:10;
    }

    .contact-button:hover{
      background:#111;
      color:white;
      border-color:#111;
    }

    /* sliding contact panel */
    .contact-panel{
      position:fixed;
      top:0;
      right:-400px;
      width:340px;
      height:100%;
      background:white;
      box-shadow:-10px 0 40px rgba(0,0,0,0.08);
      padding:60px 40px;
      text-align:left;
      transition:right 0.35s ease;
      z-index:9;
    }

    .contact-panel.open{
      right:0;
    }

    .contact-title{
      font-size:22px;
      margin-bottom:20px;
    }

    .contact-email{
      font-size:18px;
      color:#444;
      word-break:break-all;
      cursor:pointer;
    }

    .close-btn{
      position:absolute;
      top:20px;
      right:20px;
      cursor:pointer;
      font-size:18px;
      color:#888;
    }

    .close-btn:hover{
      color:#000;
    }

    .copied{
      color:green;
      font-weight:bold;
      transition:all 0.5s;
    }

  </style>
</head>

<body>

<canvas id="waveBG"></canvas>

<button class="contact-button" onclick="openContact()">Contact</button>

<div id="contactPanel" class="contact-panel">
  <div class="close-btn" onclick="closeContact()">✕</div>
  <div class="contact-title">Contact</div>
  <div id="contactEmail" class="contact-email" onclick="copyEmail()">tianqiliu2001@outlook.com</div>
</div>

<div class="container">

<h1>EasyBeau</h1>

<div class="tagline">
Revolutionising Clear Aligners for the AI Era
</div>

<div class="description">
AI-driven orthodontic treatment system.
</div>

<div class="footer">
© 2026 easybeau
</div>

</div>

<script>
  const panel = document.getElementById("contactPanel");
  const email = document.getElementById("contactEmail");

  function openContact(){ panel.classList.add("open"); }
  function closeContact(){ panel.classList.remove("open"); }

  function copyEmail(){
    navigator.clipboard.writeText(email.textContent);
    email.classList.add("copied");
    email.textContent="Copied!";
    setTimeout(()=>{ email.textContent="tianqiliu2001@outlook.com"; email.classList.remove("copied"); },1500);
  }

  /* wave animation */
  const canvas = document.getElementById("waveBG");
  const ctx = canvas.getContext("2d");
  let width = canvas.width = window.innerWidth;
  let height = canvas.height = window.innerHeight;
  const waveCount = 5;
  const waves = [];

  for(let i=0;i<waveCount;i++){
    waves.push({
      amplitude: 20+Math.random()*10,
      wavelength: 100+Math.random()*50,
      speed: 0.02 + Math.random()*0.02,
      phase: Math.random()*Math.PI*2,
      color:`rgba(0,0,0,${0.02 + Math.random()*0.02})`
    });
  }

  function drawWave(){
    ctx.clearRect(0,0,width,height);
    waves.forEach(w=>{
      ctx.beginPath();
      for(let x=0;x<width;x++){
        let y = height/2 + Math.sin(x/w.wavelength + w.phase)*w.amplitude;
        ctx.lineTo(x,y);
      }
      ctx.strokeStyle = w.color;
      ctx.lineWidth=2;
      ctx.stroke();
      w.phase += w.speed;
    });
    requestAnimationFrame(drawWave);
  }

  drawWave();

  window.addEventListener("resize",()=>{
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  });

</script>

</body>
</html>
